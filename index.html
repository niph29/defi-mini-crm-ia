<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-CRM</title>
  <style>
    :root { --fond: #f5f6f8; --carte: #fff; --texte: #1d2330; --doux: #667085; --accent: #0b6e4f; --bord: #e2e5ea; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { font-family: system-ui, sans-serif; margin: 0; background: var(--fond); color: var(--texte); }
    header { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between;
      padding: .8rem 1rem; background: var(--carte); border-bottom: 1px solid var(--bord); }
    h1 { font-size: 1.2rem; margin: 0; }
    main { padding: 1rem; }
    button { font: inherit; cursor: pointer; border: 1px solid var(--bord); background: var(--carte); border-radius: 6px; padding: .3rem .6rem; }
    button.principal { background: var(--accent); color: #fff; border-color: var(--accent); }
    select, input { font: inherit; padding: .35rem; border: 1px solid var(--bord); border-radius: 6px; }
    #pipeline { display: grid; grid-template-columns: repeat(5, minmax(180px, 1fr)); gap: .6rem; overflow-x: auto; }
    .colonne { background: #eaedf1; padding: .5rem; border-radius: 8px; min-height: 8rem; }
    .colonne.survol { outline: 2px dashed var(--accent); }
    .colonne h2 { font-size: .95rem; margin: .2rem 0 .5rem; display: flex; justify-content: space-between; }
    .colonne h2 span { color: var(--doux); font-weight: normal; }
    .carte { background: var(--carte); margin: 0 0 .5rem; padding: .5rem; border-radius: 6px; border: 1px solid var(--bord); }
    .carte[draggable="true"] { cursor: grab; }
    .carte button.nom { border: 0; padding: 0; background: none; font-weight: 600; text-align: left; color: var(--accent); }
    .carte .montant { white-space: nowrap; margin: .2rem 0; }
    .carte .proprio { color: var(--doux); font-size: .8rem; }
    .carte .actions { display: flex; justify-content: space-between; margin-top: .3rem; }
    #tableau { margin-top: 1.5rem; background: var(--carte); border: 1px solid var(--bord); border-radius: 8px; padding: 1rem; }
    #tableau h2 { margin-top: 0; font-size: 1.05rem; }
    #tableau table { border-collapse: collapse; min-width: 18rem; }
    #tableau td { padding: .25rem .8rem .25rem 0; }
    #tableau td:last-child { text-align: right; white-space: nowrap; }
    dialog { border: 1px solid var(--bord); border-radius: 10px; width: min(26rem, 92vw); }
    dialog label { display: block; margin: .6rem 0; }
    dialog input, dialog select { width: 100%; margin-top: .2rem; }
    dialog .boutons { display: flex; justify-content: flex-end; gap: .5rem; margin-top: 1rem; }
    .erreur { color: #b42318; min-height: 1.2em; }
    .lecture { color: var(--doux); }
  </style>
</head>
<body>
  <header>
    <h1>Mini-CRM</h1>
    <div>
      <label>Connecté en tant que : <select id="utilisateur"></select></label>
      <button id="reinitialiser" type="button" title="Efface les changements enregistrés dans ce navigateur">Réinitialiser les données</button>
    </div>
  </header>
  <main>
    <div id="pipeline"></div>
    <section id="tableau" hidden>
      <h2>Tableau de bord</h2>
      <p>Pipeline en cours (hors « perdu ») : <b id="total"></b></p>
      <table><tbody id="par-etape"></tbody></table>
    </section>
  </main>
  <dialog id="fiche">
    <form method="dialog" id="formulaire">
      <h2 id="fiche-titre"></h2>
      <p class="lecture" id="fiche-infos"></p>
      <label>Contact <input name="contact" required></label>
      <label>Téléphone <input name="telephone" type="tel" required></label>
      <label>Montant (FCFA) <input name="montant_fcfa" type="number" min="0" step="1" required></label>
      <label id="champ-proprietaire">Commercial attribué <select name="proprietaire"></select></label>
      <p class="erreur" id="fiche-erreur"></p>
      <div class="boutons">
        <button type="button" id="fermer">Annuler</button>
        <button class="principal" id="enregistrer" value="enregistrer">Enregistrer</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
